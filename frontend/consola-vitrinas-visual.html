function vColecciones(){
  /* Se listan las 249 colecciones reales de la tienda, no solo las 2 con
     productos cargados: encontrar la colección es el primer paso de cualquier
     tarea, y para eso el buscador necesita tener sobre qué buscar.
     De las que no están cargadas se muestra lo que sí se sabe —nombre, handle,
     orden y cuántos productos tienen en Shopify— y se dice que no lo están.  */
  const TIENDA = DATA.tienda || DATA.colecciones;
  const q = S.colQ.trim().toLowerCase();
  const editable = c => c.sortOrder==='MANUAL';

  let res = TIENDA.filter(c=>{
    if(q && !(`${c.title} ${c.handle}`.toLowerCase().includes(q))) return false;
    if(S.colF.has('editable') && !editable(c)) return false;
    if(S.colF.has('cargada') && !c.cargada) return false;
    if(S.colF.has('borrador') && !(c.cargada && pend(c.handle).length)) return false;
    return true;
  });
  /* Las cargadas primero: son sobre las que se puede trabajar hoy. */
  res = [...res].sort((a,b)=> (b.cargada?1:0)-(a.cargada?1:0)
                            || (editable(b)?1:0)-(editable(a)?1:0)
                            || a.title.localeCompare(b.title,'es'));
  const TOPE = 120, cortadas = res.length>TOPE, vis = cortadas?res.slice(0,TOPE):res;
  const nEdit = TIENDA.filter(editable).length;

  return `
  <header class="topbar"><div class="l"><span style="font-family:var(--serif);font-size:21px">Colecciones</span>
    <span class="country"><i></i>${site().k.toUpperCase()}</span></div></header>
  <div class="toolbar">
    <div class="l">
      <label class="field" style="width:340px;height:36px">🔍<input type="search" id="cq" style="flex:1"
        placeholder="Nombre o handle de la colección" value="${esc(S.colQ)}" aria-label="Buscar colección"></label>
      ${[['editable','Solo las que puedo reordenar'],['cargada','Cargadas en la maqueta'],['borrador','Con cambios sin publicar']]
        .map(([k,l])=>`<button class="chip ${S.colF.has(k)?'on':''}" data-colfil="${k}">${l}</button>`).join('')}
      ${(S.colQ||S.colF.size)?`<button class="btn xs" data-act="colLimpiar">Limpiar</button>`:''}
    </div>
    <div class="r"><span style="font-size:12px;color:var(--muted)">${res.length} de ${TIENDA.length}</span></div>
  </div>
  <div class="scroll pad">
    <div class="note" style="margin-bottom:16px"><b>Solo ${nEdit} de las ${TIENDA.length} colecciones de la tienda se pueden reordenar.</b>
      Lo que manda es <code style="font-size:11.5px">sortOrder</code>: en las demás el orden lo recalcula Shopify (BEST_SELLING o CREATED_DESC) y lo que fijes aquí se perdería.
      Ser colección inteligente no lo impide por sí solo: «Sale American Eagle» lo es y aun así está en <code style="font-size:11.5px">MANUAL</code>.
      De las ${nEdit} editables, ${DATA.colecciones.length} tienen sus productos cargados en esta maqueta.</div>
    <section class="card">
      <div class="collist">
        <div class="colrow" style="cursor:default;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--subtle);font-weight:600;background:var(--surface-muted)">
          <span>Colección · clic para editar</span><span>Estado</span><span style="text-align:right">Cargados</span><span style="text-align:right">En Shopify</span><span style="text-align:right">Orden</span><span style="text-align:right">Acción</span></div>
        ${vis.length ? vis.map(c=>{
          const ed=editable(c);
          if(c.cargada){
            const v=V[c.handle], meta=v.meta;
            const abierto = S.colHist.has(c.handle);
            return `<div class="colrow" data-open="${esc(c.handle)}" style="cursor:pointer;opacity:.9">
              <span class="t"><b>${esc(c.title)}</b><small>/${esc(c.handle)} · ${esc(meta.reglas)}</small></span>
              <span><span class="pill ${v.estado}"><span class="dot"></span>${ESTADO[v.estado] || (v.estado==='cargando'?'Cargando…':v.estado==='error'?'Error':'Publicada')} v${v.version}</span></span>
              <span class="tabular" style="text-align:right;font-weight:600;font-size:13px">${meta.cargados}</span>
              <span class="tabular" style="text-align:right;font-size:13px;color:var(--muted)">${c.totalEnShopify}</span>
              <span style="text-align:right;font-size:11.5px;color:var(--muted)" title="MANUAL: el orden lo mandas tú, y es lo que esta herramienta puede sobrescribir.">${c.sortOrder}</span>
              <span class="acc">
                <button class="btn xs" data-hist="${c.handle}" aria-expanded="${abierto}"
                  title="Ver las versiones publicadas de esta colección y volver a cualquiera">Historial ${abierto?'▴':'▾'}</button>
                <button class="btn xs" data-exportar="${c.handle}" title="Descarga un CSV con las ${meta.cargados} referencias en el orden actual">Exportar</button></span>
            </div>${abierto ? histColeccion(c.handle) : ''}`;
          }
          return `<div class="colrow" data-open="${esc(c.handle)}" style="cursor:pointer;opacity:.9">
            <span class="t"><b>${esc(c.title)}</b><small>/${esc(c.handle)}</small></span>
            <span><span class="pill" style="background:var(--neutral-soft);color:var(--muted)"><span class="dot" style="background:var(--faint)"></span>No cargada</span></span>
            <span class="tabular" style="text-align:right;font-size:13px;color:var(--faint)">—</span>
            <span class="tabular" style="text-align:right;font-size:13px;color:var(--muted)">${c.totalEnShopify}</span>
            <span style="text-align:right;font-size:11.5px;color:${ed?'var(--ok)':'var(--warn)'}"
              title="${ed?'MANUAL: se podría reordenar en cuanto se carguen sus productos.':'Shopify recalcula el orden con este criterio. Para reordenarla habría que pasarla a MANUAL primero.'}">${c.sortOrder}</span>
            <span style="text-align:right;font-size:11.5px;color:var(--muted)" title="Exportar necesita las referencias, y de esta colección solo se conocen el nombre, el handle y cuántos productos tiene. Sus productos no están cargados en la maqueta.">${ed?'Se puede reordenar':'Orden automático'}</span>
          </div>`;}).join('')
        : `<div class="empty">Ninguna colección coincide${S.colQ?` con «${esc(S.colQ)}»`:''}${S.colF.size?' y los filtros activos':''}.</div>`}
      </div>
      ${cortadas?`<div style="border-top:1px solid var(--line);background:var(--surface-muted);padding:10px 14px;font-size:12px;color:var(--muted)">
        Mostrando las primeras ${TOPE} de ${res.length}. Afina la búsqueda para ver el resto.</div>`:''}
    </section>
  </div>`;
}
/* ---------------- EDITOR ---------------- */
function editorHead(){
  const v=cur(), ch=pend(S.handle);
  return `<header class="topbar">
    <div class="l">
      <button class="btn sm" data-nav="colecciones" style="width:36px;padding:0">←</button>
      <span style="display:flex;flex-direction:column;line-height:1.3;min-width:0">
        <span style="font-size:11.5px;color:var(--subtle)">Colecciones · ${esc(site().pais)}</span>
        <span style="font-size:15.5px;font-weight:600">${esc(v.meta.title)}</span></span>
      <span class="pill ${v.estado}"><span class="dot"></span>${ESTADO[v.estado] || (v.estado==='cargando'?'Cargando…':v.estado==='error'?'Error':'Publicada')} v${v.version}</span>
      <span class="country"><i></i>${site().k.toUpperCase()}</span>
    </div>
    <div class="r">
      ${ch.length?`<span style="font-size:12.5px;font-weight:600;color:var(--danger)">${ch.length} cambios sin publicar</span>`:''}
      ${(!ch.length && v.anterior)?`<button class="btn" data-act="deshacerPub" title="Devuelve el sitio al orden que tenía antes de la última publicación">↺ Deshacer publicación</button>`:''}
      <button class="btn ghost" data-act="descartar" ${ch.length?'':'disabled'}>Descartar</button>
      <button class="btn" data-act="guardar" ${ch.length?'':'disabled'}>Guardar borrador</button>
      <button class="btn" data-act="exportar" title="Descarga un CSV con las referencias en el orden actual">Exportar</button>
      <button class="btn" data-go="preview">Vista previa</button>
      <button class="btn primary" data-go="publicar">Revisar y publicar</button>
    </div></header>`;
}

function vEditor(){
  const v=cur();
  const items=v.draft;
  return editorHead()+`
  <div class="toolbar">
    <div class="l">
      <span style="font-size:13px;font-weight:600">${items.length} productos</span>
      <span style="height:18px;width:1px;background:var(--line-strong)"></span>
      <label class="field">Ir a posición <input type="number" min="1" max="${items.length}" id="goto"></label>
      <label class="field" style="width:300px">🔍<input type="search" id="q" style="flex:1" placeholder="Referencia, EAN, nombre o color" value="${esc(S.q)}"></label>
      ${S.sel.size?`<span style="font-size:12.5px;color:var(--accent);font-weight:600">${S.sel.size} seleccionados</span>`:''}
    </div>
    <div class="r">
      <div class="seg"><button class="${S.mode==='grid'?'on':''}" data-mode="grid">Cuadrícula</button><button class="${S.mode==='list'?'on':''}" data-mode="list">Lista</button></div>
      <button class="btn sm" data-act="abrirImportar">Importar orden</button>
      <button class="btn sm solid" data-act="abrirAgregar">+ Agregar productos</button>
    </div>
  </div>
  <div class="editor">
    <div class="canvas">
      ${S.mode==='grid'?gridHtml(items):listHtml(items)}
      ${S.sel.size?bulkHtml():''}
    </div>
    ${asideHtml(items)}
  </div>`;
}

function matches(p,q){
  if(!q) return true;
  const t=q.toLowerCase();
  return (p.ref||'').toLowerCase().includes(t) || p.name.toLowerCase().includes(t)
    || (p.color||'').toLowerCase().includes(t) || (p.colorName||'').toLowerCase().includes(t)
    || (p.cat2||'').toLowerCase().includes(t) || (p.productType||'').toLowerCase().includes(t)
    || (p.silueta||'').toLowerCase().includes(t)
    || p.sizes.some(s=>s.barcode && s.barcode.includes(t));
}

function gridHtml(items){
  const vis=items.map((it,i)=>({it,i})).filter(({it})=>matches(P[it.id],S.q));
  if(!vis.length) return `<div class="empty">Ningún producto de esta vitrina coincide con «${esc(S.q)}».</div>`;
  return `<div class="gridwrap"><div class="grid" id="grid">${vis.map(({it,i})=>pcard(it,i+1)).join('')}</div></div>`;
}

function pcard(it,pos){
  const p=P[it.id], sel=S.sel.has(it.id);
  const qb=quiebre(p), ago=p.stock===0, dr=p.status!=='ACTIVE';
  let tag='';
  if(ago) tag=`<span class="tag agotado">Agotado</span>`;
  else if(dr) tag=`<span class="tag draft">No publicado</span>`;
  else if(qb) tag=`<span class="tag quiebre">${p.sizesWith}/${p.sizesTotal} tallas</span>`;
  return `<article class="pcard ${sel?'sel':''}" draggable="true" data-id="${it.id}" data-pos="${pos}">
    <div class="thumb">${thumbImg(p)}
      <span class="posbadge tabular">${pos2(pos)}</span>
      ${it.pinned?`<span class="tag pin">Fijo</span>`:''}
      ${esNuevo(p)&&!ago?`<span class="tag nuevo">Nuevo</span>`:''}
      ${tag}
      <button class="ctl cardcheck ${sel?'on':''}" data-sel="${it.id}" title="Seleccionar" aria-label="Seleccionar ${esc(p.name)}" aria-pressed="${sel}">${sel?'✓':'☐'}</button>
      <button class="ctl cardpin ${it.pinned?'on':''}" data-pin="${it.id}" title="Fijar posición" aria-label="Fijar ${esc(p.name)}" aria-pressed="${it.pinned}">⊙</button>
      <button class="ctl cardx" data-rm="${it.id}" title="Quitar de la vitrina" aria-label="Quitar ${esc(p.name)}">✕</button>
    </div>
    <div class="meta">
      <b>${esc(p.name)}</b>
      <small>${esc(p.ref||'sin ref')} · ${esc(p.color||'—')}${p.silueta?' · '+esc(p.silueta):''}</small>
      ${p.descuento&&p.descuento.pct>0
        ? `<span class="price tabular" title="${esc(descTip(p))} Precio medio realmente cobrado: ${money(precioVenta(p))}.">${money(p.price)}
             <em style="font-style:normal;font-weight:500;color:var(--danger);margin-left:5px">→ ${money(precioVenta(p))}</em></span>`
        : `<span class="price tabular">${money(p.price)}</span>`}
    </div>
    <div class="metrics tabular">
      <span title="${T.v30}${p.sold30?'':' — este no vendió nada en 30 días'}"><i>V30</i><b class="${p.sold30?(p.sold30>=10?'good':''):'dgr'}">${p.sold30??'0'}</b></span>
      <span title="${p.sellThrough!=null?T.st:T.stNil}"><i>ST</i><b class="${p.sellThrough==null?'nil':p.sellThrough>=60?'good':p.sellThrough<15?'warn':''}">${p.sellThrough!=null?formatPct(p.sellThrough):'—'}</b></span>
      <span title="${p.wos!=null?T.cob:T.cobNil}"><i>COB</i><b class="${p.wos==null?'nil':p.wos>26?'warn':p.wos<3?'dgr':'good'}">${p.wos!=null?formatWeeks(p.wos)+'s':'—'}</b></span>
      <span title="${T.stk}"><i>STK</i><b class="${ago?'dgr':p.stock<15?'warn':''}">${p.stock}</b></span>
      <span title="${esc(T.tll)} ${p.sizesWith} de ${p.sizesTotal} tallas. ${esc(tallasDetalle(p))}"><i>TLL</i><b class="${
        pctTallas(p)==null?'nil':pctTallas(p)<=40?'warn':pctTallas(p)>=80?'good':''}">${pctTallas(p)!=null?pctTallas(p)+'%':'—'}</b></span>
    </div>
  </article>`;
}

function listHtml(items){
  const vis=items.map((it,i)=>({it,i})).filter(({it})=>matches(P[it.id],S.q));
  if(!vis.length) return `<div class="empty">Ningún producto de esta vitrina coincide con «${esc(S.q)}».</div>`;
  return `<section class="card" style="flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden">
    <div class="rowgrid rowhead"><span></span><span style="text-align:center">Pos</span><span></span><span>Producto</span>
      <span title="${T.sil} ${T.silNil}">Silueta</span>
      <span class="r" title="Arriba el precio de lista. Abajo, en rojo, el precio de venta real: lo que en promedio se cobró en los últimos 30 días ya con el descuento otorgado.">Precio</span>
      <span class="r" title="${T.desc} ${T.descNil}">Dto %</span>
      <span class="r" title="${T.stk}">Stock</span>
      <span class="r" title="Unidades vendidas en los últimos 7 días, netas de devoluciones. ${T.neg}">V7d</span>
      <span class="r" title="${T.v30}">V30d</span>
      <span class="r" title="${T.st} «—» = sin movimiento de inventario en el período.">ST</span>
      <span class="r" title="${T.cob} «—» = sin ventas, no calculable.">Cob.</span>
      <span class="r" title="${T.tll} Tallas con inventario / tallas totales del surtido, y su porcentaje. Es el quiebre de talla que ve el cliente.">Tallas</span><span></span></div>
    <div class="scroll" style="flex:1;min-height:0" id="list">
      ${vis.map(({it,i})=>trow(it,i+1)).join('')}
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);background:var(--surface-muted);padding:10px 14px">
      <span style="font-size:12px;color:var(--muted)">Mostrando ${vis.length} de ${items.length} posiciones</span>
      <span style="font-size:12px;color:var(--muted)">Silueta = metafield custom.20 · Precio = lista / venta real 30d · Dto % = descuento otorgado ÷ venta bruta 30d · V7d/V30d = unidades vendidas · ST = sell through · Cob. = semanas de cobertura · Tallas = con inventario / total</span>
    </div></section>`;
}

function trow(it,pos){
  const p=P[it.id], sel=S.sel.has(it.id);
  const qb=quiebre(p), ago=p.stock===0, dr=p.status!=='ACTIVE';
  let bd='';
  if(ago) bd=`<span class="badge agotado">Agotado</span>`;
  else if(dr) bd=`<span class="badge draft">No publicado</span>`;
  else if(qb) bd=`<span class="badge quiebre">Quiebre talla</span>`;
  else if(esNuevo(p)) bd=`<span class="badge nuevo">Nuevo</span>`;
  return `<div class="rowgrid trow ${sel?'sel':''} ${(ago||dr||qb)?'alert':''}" draggable="true" data-id="${it.id}" data-pos="${pos}">
    <span style="color:var(--line-strong);cursor:grab">⣿</span>
    <span class="pos tabular">${pos2(pos)}</span>
    ${img(p,'tn')}
    <span class="nm">
      <input type="checkbox" data-sel="${it.id}" ${sel?'checked':''} aria-label="Seleccionar ${esc(p.name)}">
      <span class="tx">
        <span class="t1"><b>${esc(p.name)}</b>${bd}${it.pinned?`<span class="badge" style="background:var(--ink);color:#fff">Fijo</span>`:''}</span>
        <small>${esc(p.ref||'—')} · ${esc(p.color||'—')} · ${esc(p.cat2||p.productType||'')}</small>
      </span>
    </span>
    <span style="font-size:11.5px;color:var(--ink-soft)" title="${p.silueta?esc(T.sil):esc(T.silNil)}">${p.silueta?esc(p.silueta):'<span class="nil">—</span>'}</span>
    <span class="r tabular" style="font-size:12px;font-weight:600;line-height:1.25" title="${p.descuento?'Precio de lista '+money(p.price)+'. Precio de venta real de los últimos 30 días: '+money(precioVenta(p))+'.':'Precio de lista. Sin ventas en 30 días no hay precio de venta real.'}">${money(p.price)}${
      p.descuento&&p.descuento.pct>0?`<br><em style="font-style:normal;font-weight:600;font-size:11px;color:var(--danger)">${money(precioVenta(p))}</em>`:''}</span>
    <span class="r tabular" style="font-size:12px;font-weight:700;${p.descuento&&p.descuento.pct>=50?'color:var(--danger)':p.descuento&&p.descuento.pct>0?'color:var(--warn)':''}" title="${esc(descTip(p))}">${p.descuento ? formatPct(p.descuento.pct) : '<span class="nil">—</span>'}</span>
    <span class="r tabular" style="font-size:12px;${ago?'color:var(--danger);font-weight:700':p.stock<15?'color:var(--warn);font-weight:700':''}">${formatMetric(p.stock)}</span>
    <span class="r tabular" style="font-size:12px;${p.sold7<0?'color:var(--warn);font-weight:700':''}" ${p.sold7<0?`title="${esc(T.neg)}"`:''}>${p.sold7??'<span class="nil">0</span>'}</span>
    <span class="r tabular" style="font-size:12px;${!p.sold30?'color:var(--danger);font-weight:700':''}">${p.sold30??0}</span>
    <span class="r tabular" style="font-size:12px;font-weight:600">${p.sellThrough!=null?formatPct(p.sellThrough):'<span class="nil">—</span>'}</span>
    <span class="r tabular" style="font-size:12px">${p.wos!=null?formatWeeks(p.wos):'<span class="nil">—</span>'}</span>
    <span class="r tabular" style="font-size:12px;${qb?'color:var(--warn);font-weight:700':''}" title="${esc(T.tll)} ${esc(tallasDetalle(p))}">${p.sizesWith}/${p.sizesTotal}${
      pctTallas(p)!=null?` <small style="color:var(--muted);font-weight:500">${pctTallas(p)}%</small>`:''}</span>
    <button data-rm="${it.id}" style="border:0;background:none;color:var(--faint);cursor:pointer;font-size:13px" aria-label="Quitar ${esc(p.name)}">✕</button>
  </div>`;
}

function bulkHtml(){
  return `<div class="bulk">
    <b>${S.sel.size} ${S.sel.size===1?'producto seleccionado':'productos seleccionados'}</b><span class="sp"></span>
    <label>Mover a posición <input type="number" min="1" id="bulkpos"></label>
    <button data-act="bulkTop">Enviar al inicio</button>
    <button data-act="bulkPin">Fijar</button>
    <button data-act="bulkUnpin">Soltar</button>
    <button class="dgr" data-act="bulkRm">Quitar</button>
    <button class="plain" data-act="bulkClear">Deseleccionar</button>
  </div>`;
}

function asideHtml(items){
  const ps=items.map(i=>P[i.id]);
  const sinVenta=ps.filter(p=>!p.sold30).length, qb=ps.filter(quiebre).length;
  const conST=ps.filter(p=>p.sellThrough!=null);
  const st=conST.length?Math.round(conST.reduce((s,p)=>s+p.sellThrough,0)/conST.length):null;
  const ch=pend(S.handle);
  const used=new Set(S.sortRules.map(r=>r.k));
  return `<aside class="aside">
    <section style="display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <h2 class="seclabel">Ordenar por</h2><span style="font-size:11px;color:var(--faint)">${S.sortRules.length>1?'arrastra para cambiar la prioridad':'se aplica en cascada'}</span></div>
      <div style="display:flex;flex-direction:column;gap:6px">
        ${S.sortRules.map((r,i)=>{
          const c=CRIT.find(x=>x.k===r.k);
          const opts=CRIT.filter(x=>x.k===r.k||!used.has(x.k));
          const n=S.sortRules.length;
          /* El bloque entero se arrastra, pero no desde el desplegable ni desde
             los botones: ahí el clic tiene que hacer lo suyo. Y como arrastrar
             no se puede con teclado, el asa también mueve con ↑ y ↓.        */
          return `<div class="rule" draggable="true" data-ri="${i}">
            <div class="rtop">
              <button class="grip" data-grip="${i}" draggable="false"
                title="Arrastra para cambiar el orden de los criterios, o usa ↑ y ↓"
                aria-label="Mover «${esc(c.l)}», criterio ${i+1} de ${n}. Arrastra, o usa las flechas arriba y abajo.">⣿</button>
              <span class="n">${i+1}</span>
              <select data-rule="${i}" draggable="false">${opts.map(o=>`<option value="${o.k}" ${o.k===r.k?'selected':''}>${o.l}</option>`).join('')}</select>
              <button class="rm" data-rmrule="${i}" draggable="false" aria-label="Quitar el criterio ${esc(c.l)}">✕</button></div>
            ${c.dir===false
              ? `<span class="rdir fixed">Los fijados a mano suben al principio</span>`
              : `<button class="rdir" data-dir="${i}" draggable="false" aria-label="Invertir dirección de ${esc(c.l)}"><span>${dirLabel(r)}</span><span class="sw">⇅ invertir</span></button>`}
          </div>`;
        }).join('')}
        <button class="addrule" data-act="addrule" ${S.sortRules.length>=CRIT.length?'disabled':''}>+ Agregar criterio</button>
      </div>
      ${S.sortRules.length?`<div class="orderNote"><b>Orden resultante</b>${S.sortRules.map((r,i)=>{
          const c=CRIT.find(x=>x.k===r.k);
          return `<span><i>${i+1}</i>${c.dir===false?'Fijados primero':esc(dirLabel(r))}${i<S.sortRules.length-1?' <em>y si empatan…</em>':''}</span>`;
        }).join('')}</div>`:''}
      <div style="display:flex;align-items:center;gap:8px">
        <label class="field">Respetar primeros <input type="number" min="0" id="respect" value="${S.respect}"></label>
        <button class="btn sm primary" style="flex:1" data-act="aplicarOrden" ${S.sortRules.length?'':'disabled'}>Aplicar orden</button>
      </div>
      <button class="btn sm" data-act="progDesdeVitrina" ${S.sortRules.length?'':'disabled'}
        title="Guarda esta cascada para que se vuelva a aplicar sola cada día o cada semana">⏱ Programar esta cascada</button>
      ${S.sortRules.length
        ? `<p style="margin:0;font-size:11.5px;color:var(--muted);line-height:1.45">Los productos sin el dato del criterio (por ejemplo sin descuento porque no vendieron) quedan al final, se ordene como se ordene.</p>`
        : `<p style="margin:0;font-size:11.5px;color:var(--muted);line-height:1.45">Sin criterios el orden es 100% manual. «Respetar primeros N» protege las posiciones que fijaste a mano.</p>`}
    </section>

    <section style="display:flex;flex-direction:column;gap:8px">
      <h2 class="seclabel">Salud de la vitrina</h2>
      <div class="mini">
        <div><b class="tabular">${items.length}</b><small>Productos</small></div>
        <div><b class="tabular ${sinVenta?'dgr':''}">${sinVenta}</b><small>Sin venta 30d</small></div>
        <div><b class="tabular ${qb?'warn':''}">${qb}</b><small>Quiebre talla</small></div>
        <div><b class="tabular">${st!=null?st+'%':'—'}</b><small>ST medio</small></div>
      </div>
      <p style="margin:0;font-size:11px;color:var(--muted);line-height:1.45">ST medio calculado sobre ${conST.length} productos con movimiento de inventario en 30 días. Los demás no tienen tasa reportada por Shopify.</p>

/* ---------------- ORDEN DE LOS CRITERIOS ----------------
   La cascada se lee de arriba abajo, así que cambiar la prioridad tiene que
   ser mover el bloque, no borrarlo y volverlo a crear.                     */
function moverRegla(de, a){
  if(de===a || a<0 || a>=S.sortRules.length || de<0 || de>=S.sortRules.length) return;
  const [m]=S.sortRules.splice(de,1);
  S.sortRules.splice(a,0,m);
  S.focoRegla=a;               // para devolverle el foco a quien usa teclado
  render();
  const c=CRIT.find(x=>x.k===m.k);
  toast(`«${c.l}» ahora es el criterio ${a+1} de ${S.sortRules.length}.`);
}

let dragRegla=null;
function limpiarMarcas(){
  document.querySelectorAll('.rule').forEach(el=>el.classList.remove('sobre-arriba','sobre-abajo','arrastrando'));
}
function wireReglas(){
  const cont=document.querySelector('.aside'); if(!cont) return;
  cont.querySelectorAll('.rule').forEach(el=>{
    el.addEventListener('dragstart',e=>{
      dragRegla=+el.dataset.ri;
      el.classList.add('arrastrando');
      e.dataTransfer.effectAllowed='move';
      try{ e.dataTransfer.setData('text/plain', String(dragRegla)); }catch(err){}
    });
    el.addEventListener('dragend',()=>{ dragRegla=null; limpiarMarcas(); });
    el.addEventListener('dragover',e=>{
      if(dragRegla===null || +el.dataset.ri===dragRegla) return;
      e.preventDefault(); e.dataTransfer.dropEffect='move';
      const r=el.getBoundingClientRect();
      const arriba = e.clientY < r.top + r.height/2;
      el.classList.toggle('sobre-arriba', arriba);
      el.classList.toggle('sobre-abajo', !arriba);
    });
    el.addEventListener('dragleave',()=>el.classList.remove('sobre-arriba','sobre-abajo'));
    el.addEventListener('drop',e=>{
      e.preventDefault();
      if(dragRegla===null) return;
      const destino=+el.dataset.ri;
      const r=el.getBoundingClientRect();
      const arriba = e.clientY < r.top + r.height/2;
      let a = arriba ? destino : destino+1;
      if(dragRegla < a) a--;                 // al sacarlo, todo lo de abajo sube
      limpiarMarcas();
      moverRegla(dragRegla, a);
      dragRegla=null;
    });
  });
  /* Teclado: el asa mueve el criterio con las flechas. */
  cont.querySelectorAll('.grip').forEach(g=>{
    g.addEventListener('keydown',e=>{
      const i=+g.dataset.grip;
      if(e.key==='ArrowUp'){ e.preventDefault(); moverRegla(i,i-1); }
      else if(e.key==='ArrowDown'){ e.preventDefault(); moverRegla(i,i+1); }
    });
  });
  if(S.focoRegla!=null){
    const g=cont.querySelector(`.grip[data-grip="${S.focoRegla}"]`);
    if(g) g.focus();
    S.focoRegla=null;
  }
}

/* ---------------- DRAG & DROP ---------------- */
let dragId=null;
function wireDnd(){
  const cont=document.getElementById('grid')||document.getElementById('list');
  if(!cont) return;
  cont.querySelectorAll('[draggable=true]').forEach(el=>{
    el.addEventListener('dragstart',e=>{dragId=el.dataset.id;el.classList.add('drag');e.dataTransfer.effectAllowed='move';});
    el.addEventListener('dragend',()=>{el.classList.remove('drag');cont.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));dragId=null;});
    el.addEventListener('dragover',e=>{e.preventDefault();if(el.dataset.id!==dragId)el.classList.add('over');});
    el.addEventListener('dragleave',()=>el.classList.remove('over'));
    el.addEventListener('drop',e=>{
      e.preventDefault(); el.classList.remove('over');
      if(!dragId||el.dataset.id===dragId) return;
      const v=cur(), from=v.draft.findIndex(d=>d.id===dragId), to=v.draft.findIndex(d=>d.id===el.dataset.id);
      const [m]=v.draft.splice(from,1); v.draft.splice(to,0,m);
      v.estado='borrador'; render();
    });
  });
}

function paintDrawer(){
  const d=S.drawer; if(!d) return;
  const v=cur(), inV=new Set(v.draft.map(x=>x.id));
  /* Puesto por venta de 30 días sobre TODO el catálogo cargado. Se
     calcula una vez aquí y no dentro del filtro: si no, sería un orden
     por cada producto de la lista. */
  const rankVenta = {};
  Object.values(P).sort((a,b)=>(b.sold30||0)-(a.sold30||0))
    .forEach((p,i)=>{ rankVenta[p.id] = i+1; });
  let res=Object.values(P).filter(p=>matches(p,d.q));
  if(d.f.has('stock')) res=res.filter(p=>p.stock>0);
  if(d.f.has('mujer')) res=res.filter(p=>p.cat1==='mujer');
  if(d.f.has('hombre')) res=res.filter(p=>p.cat1==='hombre');
  if(d.f.has('nuevo')) res=res.filter(esNuevo);
  if(d.f.has('vende')) res=res.filter(p=>p.sold30);
  /* El par que faltaba: se podía filtrar «con venta» pero no «sin
     venta», que es justo el que sirve para encontrar lo que hay que
     sacar del frente. Mismo criterio que usa el Resumen. */
  if(d.f.has('sinventa')) res=res.filter(p=>!p.sold30);
  /* Venta de 7 días: rotación reciente, no acumulada. Un producto puede
     tener buen mes y llevar una semana parado. */
  if(d.f.has('venta7')) res=res.filter(p=>(p.sold7 ?? 0) > 0);
  /* Los más vendidos del sitio, no de la búsqueda: el puesto se calcula
     sobre todo el catálogo cargado para que sea el mismo número
     independientemente de lo que se esté buscando. */
  if(d.f.has('top50')) res=res.filter(p=>rankVenta[p.id] <= 50);
  /* Devolución neta: vendió menos de lo que le devolvieron. Un número
     negativo no es un error de datos, es un producto que hay que mirar. */
  if(d.f.has('devol')) res=res.filter(p=>(p.sold7 ?? 0) < 0 || (p.sold30 ?? 0) < 0);
  /* Descuento: lo que de verdad se está otorgando, no la promoción
     configurada. Sin venta en 30 días no hay porcentaje que calcular, así
     que esos productos no entran en ninguno de los dos filtros — no son
     «sin descuento», son «sin dato». */
  if(d.f.has('dtoalto')) res=res.filter(p=>pctDesc(p)!=null && pctDesc(p)>=55);
  if(d.f.has('sindto'))  res=res.filter(p=>pctDesc(p)===0);

  if(d.f.has('margenalto')) res=res.filter(p=>margen(p)!=null && margen(p)>=50);

     queda sin resultados por eso hay que decirlo: si no, parece que la
     referencia no existe. */
  const yaEnVitrina = res.filter(p=>inV.has(p.id)).length;
  if(d.f.has('nofuera')) res=res.filter(p=>!inV.has(p.id));
  const total=res.length;

  el.innerHTML=`
    <div class="dhead"><b>Agregar productos</b><button class="btn sm ghost" data-act="cerrarDrawer">Cerrar ✕</button></div>
    <div style="padding:12px 20px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px">
      <label class="field" style="height:40px">🔍<input id="dq" style="flex:1" placeholder="Referencia (11643664-153), EAN, nombre o color" value="${esc(d.q)}" autofocus></label>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        ${(() => {
          const base = [['stock','Con inventario'],['nofuera','Excluir los de la vitrina'],
                        ['mujer','Mujer'],['hombre','Hombre'],['nuevo','Nuevo (≤30 días)'],
                        ['vende','Con venta 30d'],['sinventa','Sin venta 30d'],
                        ['venta7','Vendió esta semana'],['top50','Top 50 en venta'],
                        ['dtoalto','Descuento ≥ 55%'],['sindto','Vendido sin descuento']];
          /* «Con devoluciones» solo si hay alguno: un filtro que siempre
             devuelve cero hace creer que no hay productos, no que no hay
             casos. Mismo criterio que el de margen. */
          const hayDevol = Object.values(P).some(p=>(p.sold7 ?? 0) < 0 || (p.sold30 ?? 0) < 0);
          if(hayDevol) base.push(['devol','Con devoluciones netas']);
          /* El filtro de margen solo existe si hay costo. Un filtro que
             siempre devuelve cero resultados es peor que no tenerlo: el

          const conCosto = hayCosto(P)

          return [...base, ...conCosto]

        })()}

/* ---------------- EXPORTAR ----------------
   La primera columna es `ref_pantone`, exactamente lo que lee «Importar
   orden». Así el viaje de ida y vuelta funciona: exportas, reordenas las
   filas en Excel, y vuelves a importar.
   Separador `;` y BOM UTF-8 porque es lo que abre bien Excel en español sin
   pedir nada; el importador acepta `;`, tabulador y coma por igual.        */
function csvCampo(v){
  const s = v==null ? '' : String(v);
  return /[;"\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}

function exportarVitrina(handle){
  const v=V[handle], items=v.draft;
  const cab = ['Posicion','Referencia','Producto','Color','Silueta','Fijado',
               'Precio lista','Precio venta real','Descuento %','Stock',
               'Tallas con inventario','Tallas totales','% tallas',
               'Vendido 7d','Vendido 30d','Sell through %','Cobertura semanas',
               'Dias en catalogo','Estado','EAN primera talla','URL'];
  const filas = items.map((it,i)=>{
    const p=P[it.id];
    const ean=(p.sizes||[]).find(s=>s.barcode);
    return [
      i+1, p.ref||'', p.name||'', p.colorName||p.color||'', p.silueta||'',
      it.pinned?'si':'', p.price,
      p.descuento ? (p.price*(1-p.descuento.pct/100)).toFixed(2) : '',
      p.descuento ? p.descuento.pct : '',
      p.stock, p.sizesWith, p.sizesTotal, pctTallas(p)??'',
      p.sold7??'', p.sold30??'', p.sellThrough??'', p.wos??'',
      p.daysInCatalog, p.status, ean?ean.barcode:'', p.url||''
    ].map(csvCampo).join(';');
  });
  const csv = '\uFEFF' + [cab.join(';'), ...filas].join('\r\n') + '\r\n';
  const estado = pend(handle).length ? 'borrador' : 'publicado';
  const nombre = `vitrina-${handle}-${DATA.fuente.extraido}-${estado}.csv`;
  try{
    const url = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
    const a = document.createElement('a');
    a.href=url; a.download=nombre; document.body.appendChild(a); a.click();
    a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 2000);
    toast(`${items.length} referencias exportadas a ${nombre}`);
  }catch(err){
    toast('El navegador no dejó descargar el archivo.');
  }
}

/* ---------------- IMPORTAR ORDEN DESDE EXCEL ----------------
   El orden se decide muchas veces en una hoja de cálculo antes de tocar la
   herramienta. Importarlo evita rehacer a mano un trabajo ya hecho.
   Regla: el archivo NO manda sobre el catálogo. Una referencia que no existe
   no se inventa ni se aproxima: se reporta y la decide una persona.      */
let IDX=null;
function indices(){
  if(IDX) return IDX;
  const ref={}, ean={};
  Object.values(P).forEach(p=>{
    const r=(p.ref||'').trim().toUpperCase();
    if(r){ (ref[r]=ref[r]||[]).push(p.id); }
    (p.sizes||[]).forEach(s=>{ if(s.barcode) (ean[String(s.barcode).trim()]=ean[String(s.barcode).trim()]||[]).push(p.id); });
  });
  IDX={ref,ean}; return IDX;
}
const norm = c => String(c||'').trim().replace(/^"|"$/g,'').replace(/\s+/g,'');
function resolver(celda){
  const {ref,ean}=indices(), c=norm(celda);
  if(!c) return null;
  let hit = ref[c.toUpperCase()] || ean[c];
  if(!hit) return null;
  return [...new Set(hit)];
}
function filasDe(txt){
  return txt.split(/\r?\n/).map(l=>l.replace(/\s+$/,'')).filter(l=>l.trim())
            .map(l=> l.split(/\t|;|,/) );
}
function analizarImport(){
  const d=S.imp; if(!d) return;
  const filas=filasDe(d.texto);
  d.filas=filas;
  if(!filas.length){ d.res=null; return; }
  /* Se elige la columna que más referencias resuelve. Si el usuario ya
     eligió una, se respeta: el automático propone, no impone. */
  const ncol = Math.max(...filas.map(f=>f.length));
  const puntaje=[];
  for(let c=0;c<ncol;c++) puntaje[c]=filas.filter(f=>resolver(f[c])).length;
  if(d.col==null || d.col>=ncol) d.col = puntaje.indexOf(Math.max(...puntaje));
  const col=d.col;
  /* Encabezado: si la primera fila no resuelve y el resto sí, se salta. */
  d.encabezado = filas.length>1 && !resolver(filas[0][col]) && puntaje[col] > 0;
  const cuerpo = d.encabezado ? filas.slice(1) : filas;

  const v=cur(), enVitrina=new Set(v.draft.map(x=>x.id));
  const vistos=new Set(), orden=[], inc=[];
  cuerpo.forEach((f,i)=>{
    const celda=f[col], linea=i+1+(d.encabezado?1:0);
    const hit=resolver(celda);
    if(!celda||!norm(celda)){ return; }
    if(!hit){ inc.push({t:'noexiste', linea, celda:norm(celda)}); return; }
    if(hit.length>1){ inc.push({t:'ambigua', linea, celda:norm(celda), ids:hit}); return; }
    const id=hit[0];
    if(vistos.has(id)){ inc.push({t:'repetida', linea, celda:norm(celda), id}); return; }
    vistos.add(id); orden.push(id);
    if(!enVitrina.has(id)) inc.push({t:'fuera', linea, celda:norm(celda), id});
  });
  const ausentes = v.draft.map(x=>x.id).filter(id=>!vistos.has(id));
  d.res={orden, inc, ausentes, leidas:cuerpo.length};
}

/* ---------------- OPORTUNIDADES ----------------
   La pregunta que ninguna otra pantalla responde: ¿qué se está vendiendo
   desde una posición donde casi nadie lo ve? Y al revés, ¿qué ocupa el frente
   sin venderlo.
   «Visible» se define como las primeras N posiciones, porque es lo que entra
   en pantalla sin bajar. N se ajusta: en móvil son menos, en escritorio más. */
/* Envoltorios sobre logica/oportunidades.js: la interfaz trabaja con
   handles y con el estado global; el módulo trabaja con listas puras.
   La regla vive en el módulo, aquí solo se le pasan los argumentos. */
const rankingVenta = handle => rankingVentaL(V[handle].draft, P);
function enterrados(handle, N){ return enterradosL(V[handle].draft, P, N || S.opN); }
function frenteOcioso(handle, N){ return frenteOciosoL(V[handle].draft, P, N || S.opN); }
function subirAlPuesto(handle, id, destino){
  const v = V[handle];
  const r = subirAlPuestoL(v.draft, id, destino);
  if(!r.pos) return 0;
  v.draft = r.orden; v.estado = 'borrador';
  return r.pos;
}

function vOportunidades(){
  const handles = S.opH==='todas' ? DATA.colecciones.map(c=>c.handle) : [S.opH];
  const q=S.opQ.trim().toLowerCase();
  const coincide = p => !q || matches(p,q);
  const N=S.opN;

  const filaEnterrado = (h,x) => {
    const p=P[x.id];
    return `<div class="rowgrid trow" style="grid-template-columns:44px minmax(0,1fr) 132px 84px 62px 52px 52px 52px 56px 122px;cursor:default">
      ${img(p,'tn')}
      <span class="nm"><span class="tx"><span class="t1"><b>${esc(p.name)}</b></span>
        <small>${esc(p.ref||'—')} · ${esc(p.color||'—')}${p.silueta?' · '+esc(p.silueta):''}</small></span></span>
      <span style="font-size:11.5px;color:var(--muted)">${esc(V[h].meta.title)}</span>
      <span class="r tabular" style="font-size:12px"><b style="color:var(--danger)">${x.pos}</b> <small style="color:var(--muted)">→ ${x.rank}</small></span>
      <span class="r tabular" style="font-size:12px;font-weight:700;color:var(--ok)">+${x.pos-x.rank}</span>
      <span class="r tabular" style="font-size:12px;font-weight:700">${formatMetric(p.sold30)}</span>
      <span class="r tabular" style="font-size:12px">${p.descuento ? formatPct(p.descuento.pct) : '<span class="nil">—</span>'}</span>
      <span class="r tabular" style="font-size:12px">${formatMetric(p.stock)}</span>
      <span class="r tabular" style="font-size:12px;${quiebre(p)?'color:var(--warn);font-weight:700':''}" title="${esc(tallasDetalle(p))}">${p.sizesWith}/${p.sizesTotal}</span>
      <span style="text-align:right">${quiebre(p)
        ? `<span style="font-size:11.5px;color:var(--warn);font-weight:600">Desentallado</span>`
        : `<button class="btn xs" data-subir="${h}" data-id="${x.id}" data-destino="${x.rank}" title="Lo mueve al puesto ${x.rank}, que es el que le toca por venta de 30 días">Subir a #${x.rank}</button>`}</span>
    </div>`;};

  const filaOcioso = (h,x) => {
    const p=P[x.id];
    return `<div class="rowgrid trow alert" style="grid-template-columns:44px minmax(0,1fr) 150px 92px 62px 62px 62px 150px;cursor:default">
      ${img(p,'tn')}
      <span class="nm"><span class="tx"><span class="t1"><b>${esc(p.name)}</b>${quiebre(p)?'<span class="badge quiebre">Quiebre</span>':''}</span>
        <small>${esc(p.ref||'—')} · ${esc(p.color||'—')}</small></span></span>
      <span style="font-size:11.5px;color:var(--muted)">${esc(V[h].meta.title)}</span>
      <span class="r tabular" style="font-size:12px;font-weight:700">${x.pos}</span>
      <span class="r tabular" style="font-size:12px;color:var(--danger);font-weight:700">0</span>
      <span class="r tabular" style="font-size:12px">${p.descuento ? formatPct(p.descuento.pct) : '<span class="nil">—</span>'}</span>
      <span class="r tabular" style="font-size:12px">${formatMetric(p.stock)}</span>
      <span style="text-align:right"><button class="btn xs" data-bajar="${h}" data-id="${x.id}">Sacar del frente</button></span>
    </div>`;};

  const sube=[], flojo=[], oci=[];
  handles.forEach(h=>{
    enterrados(h,N).forEach(x=>{
      if(!coincide(P[x.id])) return;
      (quiebre(P[x.id]) ? flojo : sube).push([h,x]);
    });
    frenteOcioso(h,N).forEach(x=>{ if(coincide(P[x.id])) oci.push([h,x]); });
  });
  const ent = sube;

  return `<header class="topbar"><div class="l"><span style="font-family:var(--serif);font-size:21px">Oportunidades</span>
      <span style="font-size:12.5px;color:var(--muted)">lo que vende desde donde nadie lo ve</span></div></header>
  <div class="toolbar">
    <div class="l">
      <label class="field">Zona visible: primeras <input type="number" min="1" max="60" id="opn" value="${N}" style="width:52px"> posiciones</label>
      <label class="field"><select id="oph" style="border:0;background:transparent;outline:none;font-size:12.5px;font-weight:600">
        <option value="todas" ${S.opH==='todas'?'selected':''}>Todas las vitrinas</option>
        ${DATA.colecciones.map(c=>`<option value="${c.handle}" ${S.opH===c.handle?'selected':''}>${esc(c.title)}</option>`).join('')}
      </select></label>
      <label class="field" style="width:260px">🔍<input id="opq" style="flex:1" placeholder="Referencia, nombre o color" value="${esc(S.opQ)}"></label>
    </div>
  </div>
  <div class="scroll pad" style="display:flex;flex-direction:column;gap:18px">
    <div class="note"><b>«Visible» son las primeras ${N} posiciones</b>, las que entran en pantalla sin bajar.
      Ajusta el número y las dos listas se recalculan: es una decisión de vitrina, no un dato de Shopify.</div>

    <section class="card">
      <div style="padding:13px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <h2 class="seclabel" style="margin:0">Vende y está enterrado</h2>
        <span style="font-size:12px;color:var(--muted)">${ent.length} producto${ent.length===1?'':'s'} que venden, tienen tallas, y están fuera de las primeras ${N} posiciones</span>
        ${ent.length?`<button class="btn sm solid" style="margin-left:auto" data-act="subirTodos" title="Coloca en las primeras ${N} posiciones a los que venden Y tienen tallas, en orden de venta y detrás de los fijados. Los desentallados no se tocan.">Acomodar el frente por venta</button>`:''}
      </div>
      ${ent.length?`
      <div class="rowgrid rowhead" style="grid-template-columns:44px minmax(0,1fr) 132px 84px 62px 52px 52px 52px 56px 122px">
        <span></span><span>Producto</span><span>Vitrina</span>
        <span class="r" title="Posición actual en la vitrina → puesto que le tocaría por venta de 30 días.">Pos → puesto</span>
        <span class="r" title="Cuántas posiciones por debajo de lo que le corresponde por venta está hoy.">Desfase</span>
        <span class="r">V30d</span><span class="r">Dto</span><span class="r">Stock</span>
        <span class="r" title="${T.tll}">Tallas</span><span></span></div>
      ${ent.map(([h,x])=>filaEnterrado(h,x)).join('')}`
      :`<div class="empty">Ninguno con tallas sanas. Lo que vende y tiene surtido ya está en las primeras ${N} posiciones${q?` entre lo que coincide con «${esc(S.opQ)}»`:''}.</div>`}
    </section>

    ${flojo.length?`<section class="card">
      <div style="padding:13px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <h2 class="seclabel" style="margin:0">Vende, pero está desentallado</h2>
        <span style="font-size:12px;color:var(--muted)">${flojo.length} que venderían más arriba, pero les queda el 40% o menos del surtido de tallas</span>
      </div>
      <div style="padding:12px 14px 0"><div class="note"><b>Subir esto es quemar una posición de privilegio.</b>
        El cliente llega y no encuentra su talla: se gasta el mejor espacio de la vitrina en una venta que no va a ocurrir.
        Por eso quedan aparte y «Acomodar el frente por venta» no los toca. Es el mismo criterio de quiebre que usa la validación antes de publicar.</div></div>
      <div class="rowgrid rowhead" style="grid-template-columns:44px minmax(0,1fr) 132px 84px 62px 52px 52px 52px 56px 122px">
        <span></span><span>Producto</span><span>Vitrina</span><span class="r">Pos → puesto</span><span class="r">Desfase</span>
        <span class="r">V30d</span><span class="r">Dto</span><span class="r">Stock</span><span class="r">Tallas</span><span></span></div>
      ${flojo.map(([h,x])=>filaEnterrado(h,x)).join('')}
    </section>`:''}

    <section class="card">
      <div style="padding:13px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <h2 class="seclabel" style="margin:0">Ocupa el frente y no vende</h2>
        <span style="font-size:12px;color:var(--muted)">${oci.length} en las primeras ${N} posiciones sin una sola unidad vendida en 30 días</span>
      </div>
      ${oci.length?`
      <div class="rowgrid rowhead" style="grid-template-columns:44px minmax(0,1fr) 150px 92px 62px 62px 62px 150px">
        <span></span><span>Producto</span><span>Vitrina</span><span class="r">Posición</span>
        <span class="r">V30d</span><span class="r">Dto</span><span class="r">Stock</span><span></span></div>
      ${oci.map(([h,x])=>filaOcioso(h,x)).join('')}`
      :`<div class="empty">Ninguno. Las primeras ${N} posiciones venden${q?` entre lo que coincide con «${esc(S.opQ)}»`:''}.</div>`}
    </section>
  </div>`;
}

function publicar(h){
  const v=V[h], n=pend(h).length;
  if(!n){ toast('No hay cambios que publicar.'); return; }
  const c=document.getElementById('cmt');
  if(c) v.comentario=c.value.trim();

  v.anterior={orden:[...v.publicado], version:v.version};   // para deshacer
  v.publicado=v.draft.map(d=>d.id); v.version++; v.estado='publicada';
  v.actualizado=hoy(); v.por=USUARIO;
  v.historial.push({v:v.version, fecha:hoy(), por:USUARIO,
    accion:`Publicada · ${n} cambio${n===1?'':'s'}`,
    comentario:v.comentario, orden:[...v.publicado]});
  v.comentario='';
  S.handle=h; S.view='vitrina'; render();
  toast(`Publicada la versión ${v.version} con ${n} cambio${n===1?'':'s'}. En la maqueta no se escribió en Shopify.`);
}

/* Deshacer lo último publicado. Sin paso de aprobación, esto es lo que
   convierte un error en un susto de treinta segundos.                      */
function deshacerPublicacion(h){
  const v=V[h], a=v.anterior;
  if(!a) return;
  const ids=a.orden.filter(id=>P[id]);
  v.draft=ids.map(id=>({id,pinned:false}));
  v.publicado=[...ids]; v.version++; v.estado='publicada';
  v.actualizado=hoy(); v.por=USUARIO;
  v.historial.push({v:v.version, fecha:hoy(), por:USUARIO,
    accion:`Se deshizo la publicación · vuelve al orden de la v${a.version}`,
    comentario:'', orden:[...v.publicado]});
  v.anterior=null;
  render();
  toast(`Publicación deshecha. El sitio vuelve al orden de la versión ${a.version}.`);
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-nav],[data-open],[data-go],[data-act],[data-mode],[data-pin],[data-rm],[data-sel],[data-rmrule],[data-dir],[data-pgquitar],[data-pgdir],[data-pv],[data-difftab],[data-dfil],[data-dsel],[data-colfil],[data-hist],[data-site],[data-restaurar],[data-pgcad],[data-pgdia],[data-progedit],[data-progtoggle],[data-progrun],[data-progdel],[data-exportar],[data-subir],[data-bajar]');
  if(!t) return;
  const v=cur();

  /* Cambiar de sitio recarga sus datos. Poner solo la variable dejaba
     la pantalla apuntando a un sitio con los datos del anterior. */
  if(t.dataset.hist){
    const h=t.dataset.hist;
    S.colHist.has(h) ? S.colHist.delete(h) : S.colHist.add(h);
    render(); return;
  }
  if(t.dataset.site){ S.view='resumen'; entrarAlSitio(t.dataset.site); return; }

  /* --- oportunidades --- */
  if(t.dataset.subir){
    const h=t.dataset.subir, id=t.dataset.id, destino=+t.dataset.destino;
    const p=P[id], fin=subirAlPuesto(h, id, destino);
    render(); toast(`${esc(p.ref||p.name)} subió a la posición ${fin} en ${esc(V[h].meta.title)}.`); return;
  }
  if(t.dataset.bajar){
    const h=t.dataset.bajar, id=t.dataset.id, v=V[h];
    const i=v.draft.findIndex(d=>d.id===id); if(i<0) return;
    const [m]=v.draft.splice(i,1); v.draft.push(m); v.estado='borrador';
    render(); toast(`${esc(P[id].ref||P[id].name)} se movió al final de ${esc(v.meta.title)}.`); return;
  }

  /* --- programación --- */
  if(t.dataset.pgquitar !== undefined){
    S.progForm.criterios.splice(+t.dataset.pgquitar, 1);
    render();
    return;
  }

  if(t.dataset.pgdir !== undefined){
    const r = S.progForm.criterios[+t.dataset.pgdir];
    if(r){
      r.d = r.d === 'desc' ? 'asc' : 'desc';
      render();
    }
    return;
  }

  if(t.dataset.act === 'pgAgregarCriterio'){
    const f = S.progForm;
    const selector = document.getElementById('pgNuevoCriterio');
    const clave = selector ? selector.value : '';
    const usados = new Set(f.criterios.map(r => r.k));
    if(!clave){
      toast('Selecciona primero una métrica.');
      return;
    }
    if(!CRIT.some(c => c.k === clave) || usados.has(clave)){
      toast('Selecciona una métrica disponible.');
      return;
    }
    f.criterios.push({k: clave, d: 'desc'});
    render();
    return;
  }

  if(t.dataset.pgcad){ S.progForm.cadencia=t.dataset.pgcad; render(); return; }
  if(t.dataset.pgdia!==undefined && t.dataset.pgdia!==''){
    const d=+t.dataset.pgdia, f=S.progForm;
    f.dias = f.dias.includes(d) ? f.dias.filter(x=>x!==d) : [...f.dias, d].sort();
    render(); return;
  }
  if(t.dataset.progedit){
    const pr = PROGS.find(x => x.id === +t.dataset.progedit);
    if(!pr){
      toast('No se encontró la programación.');
      return;
    }

    S.progForm = {
      id: pr.id,
      nombre: pr.nombre,
      handle: pr.handle,
      cadencia: pr.cadencia,
      dias: [...(pr.dias || [])],
      hora: pr.hora,
      accion: pr.accion,
      criterios: (pr.criterios || []).map(r => ({...r})),
      respetar: Number(pr.respetar) || 0
    };

    render();
    return;
  }

  if(t.dataset.progtoggle){
    const pr=PROGS.find(x=>x.id===+t.dataset.progtoggle);
    if(!pr) return;

    const boton = t;
    boton.disabled = true;

    (async () => {
      try {
        const activa = !pr.activa;
        const response = await fetch(
          `/api/programaciones/${pr.id}/estado`,
          {
            method: 'PATCH',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({activa})
          }
        );

        if(!response.ok){
          throw new Error(`${response.status} ${await response.text()}`);
        }

        await cargarProgramaciones();
        render();

        const actualizada = PROGS.find(p => p.id === pr.id);
        toast(actualizada?.activa
          ? `«${pr.nombre}» activada.`
          : `«${pr.nombre}» en pausa.`);
      } catch(error) {
        console.error('Error cambiando estado:', error);
        toast(`No se pudo cambiar el estado: ${error.message}`);
        boton.disabled = false;
      }
    })();

    return;
  }
  if(t.dataset.progrun){
    const pr=PROGS.find(x=>x.id===+t.dataset.progrun); if(!pr) return;
    ejecutarProg(pr, true); return;
  }
  if(t.dataset.progdel){
    const pr = PROGS.find(x => x.id === +t.dataset.progdel);
    if(!pr) return;

    const boton = t;
    boton.disabled = true;

    (async () => {
      try {
        await api.eliminarProgramacion(pr.id);
        await cargarProgramaciones();
        render();
        toast(`«${pr.nombre}» eliminada.`);
      } catch(error) {
        console.error('Error eliminando programación:', error);
        toast(`No se pudo eliminar la programación: ${error.message}`);
        boton.disabled = false;
      }
    })();

    return;
  }

  /* --- historial --- */
  if(t.dataset.restaurar){
    const w=V[t.dataset.restaurar], h=w.historial.find(x=>x.v===+t.dataset.v);
    if(!h) return;
    const ids=h.orden.filter(id=>P[id]);
    const perdidos=h.orden.length-ids.length;
    w.draft=ids.map(id=>({id,pinned:false})); w.estado='borrador';
    S.handle=t.dataset.restaurar; S.view='vitrina'; render();
    toast(`Versión ${h.v} restaurada como borrador${perdidos?` · ${perdidos} referencia(s) ya no están en el catálogo y se omitieron`:''}.`);
    return;
  }

  if(t.dataset.nav){
    const k=t.dataset.nav;

    if(k==='vitrina'&&!S.handle){
      S.handle=DATA.colecciones.find(c=>c.handle!=='frontpage')?.handle;
    }

    if(k==='oportunidades'){
      S.view='oportunidades';
      S.sel.clear();

      const h=(S.opH && S.opH!=='todas' && S.opH!=='frontpage')
        ? S.opH
        : DATA.colecciones.find(c=>c.handle!=='frontpage')?.handle;

      if(h){
        S.opH=h;

        if(!V[h] || !V[h].draft || V[h].draft.length===0){
          cargarVitrina(h).then(()=>{
            S.view='oportunidades';
            S.opH=h;
            render();
          });
          return;
        }
      }

      render();
      return;
    }

    S.view=k;
    S.sel.clear();

    if (k === 'programacion') {
      render();
      cargarProgramaciones()
        .then(() => render())
        .catch(error => {
          console.error('Error cargando programaciones:', error);
          toast('No se pudieron cargar las programaciones desde el servidor.');
        });
      return;
    }

    render();
    return;
  }
  if(t.dataset.exportar){ e.stopPropagation(); exportarVitrina(t.dataset.exportar); return; }
  if(t.dataset.open){
    /* Una colección puede abrirse aunque todavía no tenga sus productos
       cargados en memoria. cargarVitrina se encarga de mostrar la carga
       y luego traer los datos reales desde el backend. */
    cargarVitrina(t.dataset.open);
    return;
  }
  if(t.dataset.go){ S.view=t.dataset.go; render(); return; }
  if(t.dataset.mode){ S.mode=t.dataset.mode; render(); return; }
  if(t.dataset.pv){ S.pv=t.dataset.pv; render(); return; }
  if(t.dataset.difftab){ S.diffTab=t.dataset.difftab; render(); return; }

  if(t.dataset.sel!==undefined && t.dataset.sel){
    const id=t.dataset.sel; S.sel.has(id)?S.sel.delete(id):S.sel.add(id); render(); return;
  }
  if(t.dataset.pin){
    const it=v.draft.find(d=>d.id===t.dataset.pin); it.pinned=!it.pinned; render(); return;
  }
  if(t.dataset.rm){
    v.draft=v.draft.filter(d=>d.id!==t.dataset.rm); S.sel.delete(t.dataset.rm);
    v.estado='borrador'; render(); return;
  }
  if(t.dataset.rmrule!==undefined && t.dataset.rmrule!==''){ S.sortRules.splice(+t.dataset.rmrule,1); render(); return; }
  if(t.dataset.dir!==undefined && t.dataset.dir!==''){ const r=S.sortRules[+t.dataset.dir]; r.d=r.d==='desc'?'asc':'desc'; render(); return; }

  if(t.dataset.colfil){ const k=t.dataset.colfil; S.colF.has(k)?S.colF.delete(k):S.colF.add(k); render(); return; }
  if(t.dataset.dfil){ const k=t.dataset.dfil; S.drawer.f.has(k)?S.drawer.f.delete(k):S.drawer.f.add(k); paintDrawer(); return; }
  if(t.dataset.dsel){ const id=t.dataset.dsel; S.drawer.sel.has(id)?S.drawer.sel.delete(id):S.drawer.sel.add(id); paintDrawer(); return; }

  const a=t.dataset.act;
  if(a==='abrirAgregar'){ openAdd(); return; }
  if(a==='cerrarDrawer'){ closeDrawer(); render(); return; }
  if(a==='confirmAdd'){
    const ids=[...S.drawer.sel].map(id=>({id,pinned:false}));
    if(S.drawer.ins==='start') v.draft=[...ids,...v.draft]; else v.draft=[...v.draft,...ids];
    v.estado='borrador'; const n=ids.length; closeDrawer(); render(); toast(`${n} producto${n===1?'':'s'} agregado${n===1?'':'s'} a la vitrina`); return;
  }
  if(a==='addrule'){
    const used=new Set(S.sortRules.map(r=>r.k)); const next=CRIT.find(c=>!used.has(c.k));
    if(next) S.sortRules.push({k:next.k,d:'desc'}); render(); return;
  }
  if(a==='aplicarOrden'){
    /* La regla de orden vive en logica/orden.js y en ningún otro sitio.
       Aquí había una copia del mismo bucle: dos copias de la misma regla
       terminan divergiendo, y entonces la pantalla y la programación de
       las 6:00 ordenan distinto sin que nadie sepa por qué. */
    v.draft = ordenarEnCascada(v.draft, S.sortRules, S.respect, P);
    v.estado='borrador'; S.sel.clear(); render();
    toast(`Orden aplicado: ${cascadaEnPalabras(S.sortRules)}. Queda como borrador.`);
    return;
  }
  if(a==='bulkTop'){
    const s=v.draft.filter(d=>S.sel.has(d.id)), r=v.draft.filter(d=>!S.sel.has(d.id));
    v.draft=[...s,...r]; v.estado='borrador'; render(); return;
  }
  if(a==='bulkPin'||a==='bulkUnpin'){ v.draft.forEach(d=>{if(S.sel.has(d.id))d.pinned=(a==='bulkPin')}); render(); return; }
  if(a==='bulkRm'){ const n=S.sel.size; v.draft=v.draft.filter(d=>!S.sel.has(d.id)); S.sel.clear(); v.estado='borrador'; render(); toast(`${n} productos retirados de la vitrina`); return; }
  if(a==='bulkClear'){ S.sel.clear(); render(); return; }
  if(a==='descartar'){ v.draft=v.publicado.map(id=>({id,pinned:false})); v.estado='publicada'; v.comentario=''; S.sel.clear(); render(); toast('Cambios descartados. El borrador vuelve a la versión publicada.'); return; }
  if(a==='guardar'){ v.estado='borrador'; render(); toast('Borrador guardado. Nada se escribió en Shopify hasta que publiques.'); return; }
  if(a==='olvidar'){ olvidar().then(render); toast('Borrador descartado. Se volvió al orden publicado.'); return; }
  if(a==='exportar'){ exportarVitrina(S.handle); return; }
  if(a==='subirTodos'){
    /* Moverlos de uno en uno empujaba fuera del frente a los que ya estaban
       ahí vendiendo: subir diez al top 12 desaloja a diez, y entre ellos caía
       el #1 en ventas. Por eso no se mueve uno a uno: se coloca de golpe a
       TODO el que merece frente, en orden de venta, detrás de los fijados.
       Así es idempotente y nadie que venda se queda fuera por el camino.   */
    const hs = S.opH==='todas' ? DATA.colecciones.map(c=>c.handle) : [S.opH];
    let n=0;
    hs.forEach(h=>{
      const v=V[h];
      const antes = v.draft.map(d=>d.id).join(',');
      const nuevo = acomodarFrente(v.draft, P, S.opN);
      const despues = nuevo.map(d=>d.id).join(',');
      if(despues!==antes){
        n += nuevo.filter((d,i)=>v.draft[i].id!==d.id).length;
        v.draft = nuevo; v.estado='borrador';
      }
    });
    render();
    toast(n?`El frente quedó ordenado por venta: ${n} producto${n===1?'':'s'} colocados. Queda como borrador.`:'El frente ya estaba ordenado por venta.');
    return;
  }
  if(a==='publicar'){ publicar(S.handle); return; }

  if(a==='progDesdeVitrina' || a==='progNueva'){
    const h = a==='progDesdeVitrina' ? S.handle : DATA.colecciones[0].handle;
    const crits = a==='progDesdeVitrina' ? S.sortRules.map(r=>({...r})) : [];
    S.progForm = {id:null, handle:h, nombre:'', cadencia:'diaria', dias:[1,2,3,4,5],
                  hora:'06:00', accion:'borrador', criterios:crits, respetar:S.respect};
    S.view='programacion'; render();
    if(a==='progDesdeVitrina') toast('Se copió la cascada que tenías cargada. Elige cada cuánto se repite.');
    return;
  }
  if(a==='progCancelar'){ S.progForm=null; render(); return; }
  if(a==='progGuardar'){
    const f=S.progForm;
    if(!f || !f.criterios.length) return;
    if(f.cadencia==='dias' && !f.dias.length){
      toast('Elige al menos un día de la semana.');
      return;
    }

    f.nombre = (f.nombre||'').trim() || `Reordenar ${V[f.handle].meta.title}`;

    const datos = {
      nombre: f.nombre,
      handle: f.handle,
      cadencia: f.cadencia,
      dias: f.dias,
      hora: f.hora,
      accion: f.accion,
      criterios: f.criterios,
      respetar: f.respetar,
      activa: f.id
        ? Boolean(PROGS.find(p => p.id === f.id)?.activa)
        : true
    };

    const boton = t;
    boton.disabled = true;

    (async () => {
      try {
        if(f.id){
          await api.actualizarProgramacion(f.id, datos);
        }else{
          await api.crearProgramacion(datos);
        }

        await cargarProgramaciones();
        S.progForm = null;
        render();

        const guardada = PROGS.find(p =>
          p.handle === datos.handle && p.nombre === datos.nombre
        );
        toast(`Programación guardada. ${cadenciaEnPalabras(guardada || datos)}.`);
      } catch(error) {
        console.error('Error guardando programación:', error);
        toast(`No se pudo guardar la programación: ${error.message}`);
        boton.disabled = false;
      }
    })();

    return;
  }
  if(a==='deshacerPub'){ deshacerPublicacion(S.handle); return; }

  /* --- importar orden --- */
  if(a==='colLimpiar'){ S.colQ=''; S.colF.clear(); render(); return; }
  if(a==='abrirImportar'){ S.imp={texto:'',filas:[],col:null,res:null,resto:'final',agregar:false,encabezado:false}; S.view='importar'; render(); return; }
  if(a==='impLimpiar'){ S.imp={texto:'',filas:[],col:null,res:null,resto:S.imp.resto,agregar:S.imp.agregar,encabezado:false}; render(); return; }
  if(a==='impAplicar'){
    const d=S.imp, r=d.res; if(!r||!r.orden.length) return;
    const enV=new Set(v.draft.map(x=>x.id));
    const pin=new Map(v.draft.map(x=>[x.id,x.pinned]));
    let base = r.orden.filter(id=>d.agregar||enV.has(id));
    const nuevos = base.filter(id=>!enV.has(id)).length;
    let cola = [];
    if(d.resto==='final'){
      const puesto=new Set(base);
      cola = v.draft.filter(x=>!puesto.has(x.id));
    }
    v.draft=[...base.map(id=>({id,pinned:pin.get(id)||false})), ...cola];
    v.estado='borrador'; S.imp=null; S.view='vitrina'; render();
    toast(`Orden importado: ${base.length} posiciones${nuevos?` · ${nuevos} agregados`:''}${d.resto==='quitar'&&cola.length===0?'':''}. Queda como borrador.`);
    return;
  }
});

document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='q'){ S.q=e.target.value; const el=document.querySelector('.canvas'); render(); const f=document.getElementById('q'); if(f){f.focus();f.setSelectionRange(f.value.length,f.value.length);} return; }
  if(id==='cq'){ S.colQ=e.target.value; render(); const f=document.getElementById('cq'); if(f){f.focus();f.setSelectionRange(f.value.length,f.value.length);} return; }
  if(id==='dq'){ S.drawer.q=e.target.value; paintDrawer(); const f=document.getElementById('dq'); if(f){f.focus();f.setSelectionRange(f.value.length,f.value.length);} return; }
  if(id==='respect'){ S.respect=Math.max(0,+e.target.value||0); return; }
  if(id==='pgnombre'){ S.progForm.nombre=e.target.value; return; }
  if(id==='opq'){ S.opQ=e.target.value; render(); const f=document.getElementById('opq'); if(f){f.focus();f.setSelectionRange(f.value.length,f.value.length);} return; }
  if(id==='opn'){ S.opN=Math.max(1,Math.min(60,+e.target.value||12)); render(); return; }
  if(id==='pghora'){ S.progForm.hora=e.target.value; return; }
  if(id==='imptxt'){
    S.imp.texto=e.target.value;
    /* Se valida con un respiro: analizar en cada tecla repinta la tabla
       entera y hace saltar el cursor mientras se pega una lista larga. */
    clearTimeout(window._impT);
    window._impT=setTimeout(()=>{
      const pos=e.target.selectionStart;
      analizarImport(); render();
      const f=document.getElementById('imptxt');
      if(f){ f.focus(); try{f.setSelectionRange(pos,pos);}catch(err){} }
    },400);
    return;
  }
});
document.addEventListener('change',e=>{
  if(e.target.id==='oph'){
    const handle = e.target.value;
    S.opH = handle;

    if(handle === 'todas'){
      render();
      return;
    }

    if(!V[handle] || !V[handle].draft || V[handle].draft.length === 0){
      const vistaAnterior = S.view;
      cargarVitrina(handle).then(()=>{
        S.view = vistaAnterior;
        S.opH = handle;
        render();
      });
      return;
    }

    render();
    return;
  }
  if(e.target.dataset.pgcriterio !== undefined){
    const i = +e.target.dataset.pgcriterio;
    const f = S.progForm;
    const clave = e.target.value;
    if(f && f.criterios[i] && CRIT.some(c => c.k === clave)){
      f.criterios[i].k = clave;
      if(clave === 'pinned') f.criterios[i].d = 'desc';
      render();
    }
    return;
  }
  if(e.target.id==='pgrespetar'){
    S.progForm.respetar = Math.max(0, Number(e.target.value) || 0);
    return;
  }

  if(e.target.id==='pgvitrina'){ S.progForm.handle=e.target.value; render(); return; }
  if(e.target.name==='pgaccion'){ S.progForm.accion=e.target.value; render(); return; }
  /* El selector de sitio lo maneja pintarSelectorDeSitio() con su propio
     onchange, porque cambiar de sitio es una operación asíncrona: hay que
     traer los datos del sitio nuevo. Este manejador delegado hacía lo
     mismo pero sin traerlos, y ganaba la carrera. Un evento, un dueño. */
  if(e.target.id==='impcol'){ S.imp.col=+e.target.value; analizarImport(); render(); return; }
  if(e.target.id==='impadd'){ S.imp.agregar=e.target.checked; render(); return; }
  if(e.target.name==='impresto'){ S.imp.resto=e.target.value; render(); return; }
  if(e.target.id==='impfile'){
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{ S.imp.texto=String(rd.result||''); S.imp.col=null; analizarImport(); render(); toast(`Archivo «${f.name}» leído.`); };
    rd.onerror=()=>toast('No se pudo leer el archivo.');
    rd.readAsText(f);
    return;
  }
  if(e.target.dataset.rule!==undefined && e.target.dataset.rule!==''){ S.sortRules[+e.target.dataset.rule].k=e.target.value; render(); return; }
  if(e.target.id==='dins'){ S.drawer.ins=e.target.value; return; }
  if(e.target.id==='goto'){
    const n=+e.target.value; const cont=document.getElementById('grid')||document.getElementById('list');
    const el=cont&&cont.querySelector(`[data-pos="${n}"]`);
    if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); el.style.outline='2px solid var(--accent)'; setTimeout(()=>el.style.outline='',1600); }
    return;
  }
  if(e.target.id==='bulkpos'){
    const v=cur(), n=+e.target.value; if(!(n>0)) return;
    const s=v.draft.filter(d=>S.sel.has(d.id)), r=v.draft.filter(d=>!S.sel.has(d.id));
    r.splice(Math.min(n-1,r.length),0,...s); v.draft=r; v.estado='borrador'; render(); return;
  }
});
document.getElementById('scrim').addEventListener('click',()=>{closeDrawer();render();});

/* El aviso de fotos se redacta según lo que de verdad pasa con los datos
   de este sitio. Se llama al cargar un sitio, no al cargar el archivo:
   cada sitio tiene sus propias fotos y su propio problema. */
function avisoFotos(){
  const el = document.getElementById('imgwarntxt');
  if(!el || !DATA) return;
  /* Versión sin fotos: no es un fallo, es a propósito. Cada producto se
     dibuja con el marcador de su color. */
  if(DATA.fuente.sinFotos){ el.innerHTML = ''; return; }
  const f = DATA.fuente.fotosIncrustadas;
  el.innerHTML = f
    ? `<b>Faltan ${f.sinFoto} foto${f.sinFoto===1?'':'s'}.</b> ${f.n} de ${f.n+f.sinFoto} vienen
       incrustadas en los datos y no necesitan internet. Las otras se piden al CDN de Shopify
       (<code style="font-size:11px">cdn.shopify.com</code>) porque en la carpeta de imágenes son
       archivos de OneDrive «solo en la nube»: tienen tamaño pero no contenido local.`
    : `<b>Las fotos no están cargando.</b> Vienen del CDN de Shopify
       (<code style="font-size:11px">cdn.shopify.com</code>) y las pide tu navegador directamente:
       algo las está bloqueando. Revisa la salida a internet de este equipo.`;
}

/* ------------------------------------------------------------------
   ARRANQUE
   La interfaz ya no nace con los datos puestos: los pide. Mientras
   llegan se dice que está cargando, y si el servidor no responde se
   dice qué pasó — nunca una pantalla vacía sin explicación.
   ------------------------------------------------------------------ */
async function arrancar(){
  const main = document.getElementById('main');
  main.innerHTML = '<div class="card" style="margin:24px"><p>Cargando…</p></div>';
  try{
    const sitios = await api.sitios();
    SITES.length = 0;
    sitios.forEach(x => SITES.push({
      k:x.clave, pais:x.pais, nombre:x.nombre, dominio:x.dominio || '—', moneda:x.moneda,
      marca:x.marca,
      estado: x.activo ? 'conectado' : 'sin_conectar',
      motivo: x.activo
        ? (x.fuente === 'snapshot' ? 'Leyendo de un snapshot de solo lectura.' : 'Conectado a Shopify.')
        : (x.faltaDominio
            ? 'Tienda Shopify aparte. Falta el dominio .myshopify.com para poder conectarla.'
            : 'Tienda Shopify aparte. Falta el token de Admin API.'),
    }));
    pintarSelectorDeSitio();
    const primero = SITES.find(x => x.estado === 'conectado') || SITES[0];
    S.site = primero.k;
    await entrarAlSitio(S.site);
  }catch(e){
    main.innerHTML = `<div class="card" style="margin:24px"><h2>No se pudo hablar con el servidor</h2>
      <p>${esc(e.message)}</p>
      <p class="muted">Revisa que <code>uv run uvicorn app.main:app --reload</code> siga corriendo en la terminal.</p></div>`;
  }
}

/* Cambiar de sitio recarga los datos de ese sitio y nada más: el sitio
   es contexto global, se elige una vez y filtra todo. Nunca se duplica
   el menú por país. */
async function entrarAlSitio(clave){
  S.site = clave;
  S.handle = null; S.sel.clear();
  const s = SITES.find(x => x.k === clave);
  if(!s || s.estado !== 'conectado'){ DATA = null; P = null; render(); return; }
  const main = document.getElementById('main');
  main.innerHTML = '<div class="card" style="margin:24px"><p>Cargando ' + esc(s.pais) + '…</p></div>';
  try{
    const cargado = await cargarSitio(clave);
    DATA = cargado.DATA;
    P = cargado.P;
    RESUMEN_METRICAS = null;
    await cargarResumenMetricas();
    Object.keys(V).forEach(k => delete V[k]);
    cargado.vitrinas.forEach(v => { V[v.handle] = v; });
    S.handle = DATA.colecciones.length ? DATA.colecciones[0].handle : null;
    restaurar();
    avisoFotos();
    render();
  }catch(e){
    main.innerHTML = `<div class="card" style="margin:24px"><h2>No se pudieron cargar los datos de ${esc(s.pais)}</h2>
      <p>${esc(e.message)}</p></div>`;
  }
}


async function cargarResumenMetricas() {
  const respuesta = await fetch('/api/resumen-metricas');

  if (!respuesta.ok) {
    throw new Error(
      `Error al cargar el resumen general: ${respuesta.status}`
    );
  }

  const datos = await respuesta.json();
  RESUMEN_METRICAS = Array.isArray(datos.productos)
    ? datos.productos
    : [];

  return RESUMEN_METRICAS;
}

async function cargarVitrina(handle){
  S.handle = handle;
  S.view = 'vitrina';
  S.sel.clear();
  S.q = '';

  if(!V[handle]){
    const c = DATA?.colecciones?.find(x => x.handle === handle);
    V[handle] = {
      handle,
      meta: c || {handle, title: handle, totalEnShopify: 0, cargados: 0},
      publicado: [],
      draft: [],
      version: 0,
      estado: 'cargando',
      actualizado: null,
      por: 'Shopify',
      comentario: '',
      anterior: null,
      historial: []
    };
  }

  V[handle].estado = 'cargando';
  render();

  try{
    /* Esta petición SOLO trae la colección y sus productos.
       Nunca esperamos a ShopifyQL para poder pintar la vitrina. */
    const data = await api.vitrina(S.site, handle);

    const itemsColeccion = data.coleccion?.items || [];
    const productos = data.productos || {};

    Object.entries(productos).forEach(([id, producto]) => {
      const anterior = P[id] || {};
      P[id] = {
        ...anterior,
        ...producto,
        color: producto.color ?? anterior.color ?? null,
        colorName: producto.colorName ?? anterior.colorName ?? null,
        cat1: producto.cat1 ?? anterior.cat1 ?? null,
        silueta: producto.silueta ?? anterior.silueta ?? null,
        daysInCatalog: producto.daysInCatalog ?? anterior.daysInCatalog ?? null,
        sold7: anterior.sold7 ?? null,
        sold30: anterior.sold30 ?? null,
        sellThrough: anterior.sellThrough ?? null,
        wos: anterior.wos ?? null,
        descuento: anterior.descuento ?? null
      };
    });

    const borradorBackend = data.vitrina?.borrador || [];
    const publicadoBackend = data.vitrina?.publicado || [];

    V[handle].draft = borradorBackend.length
      ? borradorBackend.map(x => typeof x === 'string' ? ({id:x,pinned:false}) : x)
      : itemsColeccion.map(item => ({id:item.id, pinned:false}));

    V[handle].publicado = publicadoBackend.length
      ? publicadoBackend
      : itemsColeccion.map(item => item.id);
    V[handle].version = data.vitrina?.version ?? 0;
    V[handle].estado = data.vitrina?.estado || 'publicada';
    V[handle].actualizado = data.vitrina?.actualizado ?? null;
    V[handle].por = data.vitrina?.por ?? 'Shopify';
    V[handle].anterior = data.vitrina?.anterior ?? null;
    V[handle].historial = data.vitrina?.historial || [];

    const col = DATA.colecciones.find(c => c.handle === handle);
    if(col && data.coleccion){
      col.items = itemsColeccion;
      col.cargados = itemsColeccion.length;
      col.totalEnShopify = data.coleccion.totalEnShopify ?? col.totalEnShopify;
      col.cargada = true;
    }

    const tiendaCol = DATA.tienda?.find(c => c.handle === handle);
    if(tiendaCol && data.coleccion){
      tiendaCol.cargada = true;
      tiendaCol.cargados = itemsColeccion.length;
      tiendaCol.totalEnShopify = data.coleccion.totalEnShopify ?? tiendaCol.totalEnShopify;
    }

    /* Pintamos productos inmediatamente. Las métricas llegan por separado. */
    render();

    cargarMetricasColeccion(handle, itemsColeccion.map(item => item.id));
  }catch(e){
    console.error(e);
    V[handle].estado = 'error';
    render();
    toast('No se pudieron cargar los productos de la colección: ' + e.message);
  }
}

async function cargarMetricasColeccion(handle, productIds){
  if(!productIds.length) return;

  try{
    const response = await fetch(`/api/metricas?ids=${encodeURIComponent(productIds.join(','))}`);
    if(!response.ok) throw new Error(`Error /api/metricas: ${response.status}`);

    const metricas = await response.json();

    Object.entries(metricas || {}).forEach(([id, metrica]) => {
      if(!P[id]) return;
      P[id].sold7 = metrica.sold7 ?? null;
      P[id].sold30 = metrica.sold30 ?? null;
      P[id].sellThrough = metrica.sellThrough ?? null;
      const stock = P[id].stock;
      const sold30 = metrica.sold30;
      P[id].wos = (
        stock != null && sold30 != null && sold30 > 0
      ) ? stock / (sold30 / 4.33) : null;
      P[id].descuento = metrica.descuento ?? null;
    });

    render();
  }catch(e){
    console.warn('Las métricas no pudieron cargarse:', e);
    /* La vitrina y sus productos siguen funcionando aunque ShopifyQL falle. */
  }
}

function pintarSelectorDeSitio(){
  /* Con cinco sitios y dos marcas, una lista plana obliga a leer las cinco
     opciones para encontrar la propia. Agrupadas por marca, el ojo va
     directo. Si algún día hay una sola marca, el agrupador desaparece
     solo y la lista queda plana como antes. */
  const sel = document.getElementById('site');
  const marcas = [...new Set(SITES.map(s => s.marca || ''))];
  const opcion = s => `<option value="${esc(s.k)}">${esc(s.pais)}${s.dominio && s.dominio!=='—' ? ' · '+esc(s.dominio) : ''}${s.estado==='conectado'?'':' (sin conectar)'}</option>`;
  sel.innerHTML = marcas.length > 1
    ? marcas.map(m => `<optgroup label="${esc(m)}">${SITES.filter(s=>(s.marca||'')===m).map(opcion).join('')}</optgroup>`).join('')
    : SITES.map(opcion).join('');
  sel.value = S.site;
  sel.onchange = e => entrarAlSitio(e.target.value);
}

arrancar();

</script>
